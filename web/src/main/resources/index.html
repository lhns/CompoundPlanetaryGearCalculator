<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <link rel="icon" href="data:," />
  <title>Compound Planetary Gear Calculator</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #0d1117;
      --bg-top: #0b0f14;
      --header-bg: rgba(22, 27, 34, 0.85);
      --panel: #161b22;
      --panel-2: #0e1116;
      --border: #30363d;
      --text: #e6e6e6;
      --muted: #a6accd;
      --accent: #58a6ff;
      --accent-2: #7ee787;
      --row-sel: #1f6feb44;
      --hover: #21262d;
      --hover-soft: rgba(255,255,255,0.04);
      --thumb-border: #0d1117;
      --warn: #d29922;
      --danger: #f85149;
      --disabled: #6e7681;
      --schematic-bg: #07090d;
      --schematic-glow-1: rgba(88,166,255,0.06);
      --schematic-glow-2: rgba(157,78,221,0.06);
      --shadow: rgba(0,0,0,0.4);
      /* schematic (read by the SVG) */
      --svg-text: #e6e6e6;
      --svg-sub: #a6accd;
      --svg-hub: #0d1117;
      --svg-track: #30363d;
      --role-input: #7ee787;
      --role-output: #58a6ff;
      --role-fixed: #ff7b72;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f8fa;
        --bg-top: #eef1f5;
        --header-bg: rgba(255, 255, 255, 0.9);
        --panel: #ffffff;
        --panel-2: #f3f5f8;
        --border: #d0d7de;
        --text: #1f2328;
        --muted: #59636e;
        --accent: #0969da;
        --accent-2: #1a7f37;
        --row-sel: #0969da22;
        --hover: #e6ebf1;
        --hover-soft: rgba(0,0,0,0.04);
        --thumb-border: #ffffff;
        --warn: #9a6700;
        --danger: #cf222e;
        --disabled: #8c959f;
        --schematic-bg: #fbfcfd;
        --schematic-glow-1: rgba(9,105,218,0.05);
        --schematic-glow-2: rgba(130,80,223,0.05);
        --shadow: rgba(31,35,40,0.2);
        --svg-text: #1f2328;
        --svg-sub: #59636e;
        --svg-hub: #ffffff;
        --svg-track: #d0d7de;
        --role-input: #1a7f37;
        --role-output: #0969da;
        --role-fixed: #cf222e;
      }
    }
    * { box-sizing: border-box; }
    img, svg, canvas, video { max-width: 100%; }
    /* Grid and flex items default to min-width:auto and would grow to their content; let them shrink. */
    .app > *, .top-grid > *, .panel > *, .panel-header > *, .controls > *, .show-more-row > * { min-width: 0; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, var(--bg-top), var(--bg) 320px);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 0.75rem 1.25rem;
      background: var(--header-bg);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: baseline; gap: 0.25rem 0.75rem; flex-wrap: wrap;
      position: sticky; top: 0; z-index: 10;
    }
    header h1 { font-size: 1.05rem; margin: 0; letter-spacing: 0.01em; }
    header .badge {
      font-size: 0.7rem; color: var(--muted); padding: 2px 8px;
      border: 1px solid var(--border); border-radius: 999px;
    }
    .app { padding: 1rem; max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 1rem; }
    .top-grid { display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: 1rem; }
    @media (max-width: 900px) { .top-grid { grid-template-columns: minmax(0, 1fr); } }
    @media (max-width: 600px) {
      header { padding: 0.6rem 0.75rem; flex-wrap: wrap; }
      .app { padding: 0.5rem; gap: 0.6rem; }
      .panel { padding: 0.75rem; }
      .schematic { min-height: 280px; padding: 0.25rem; }
      .schematic svg { min-height: 260px; }
      .schematic-panel .panel-header, .controls { flex-wrap: wrap; }
      .results-panel .panel-header { padding: 0.75rem; }
      .show-more-row { flex-wrap: wrap; padding: 0.6rem 0.75rem; }
      .show-more-row > .panel-sub { white-space: normal; flex-basis: 100%; }
      .show-more-right { margin-left: 0; }
      .toast-stack { left: 0.5rem; right: 0.5rem; max-width: none; }
      th, td { padding: 0.35rem 0.5rem; }
      input, select { font-size: 16px; } /* no zoom-on-focus on phones */
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset;
    }
    .panel h2 { margin: 0 0 0.5rem 0; font-size: 0.95rem; color: var(--text); }
    .panel-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 0.5rem; }
    .panel-title { font-weight: 600; }
    .panel-sub { color: var(--muted); font-size: 0.8rem; font-family: ui-monospace, monospace; }

    label { display: block; font-size: 0.78rem; margin-top: 0.55rem; color: var(--muted); }
    input, select {
      width: 100%; max-width: 100%; min-width: 0; padding: 0.4rem 0.5rem; background: var(--panel-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px; font: inherit;
    }
    input[type="number"] { font-variant-numeric: tabular-nums; }
    input:focus, select:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
    /* Visible keyboard focus everywhere */
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    input[type="checkbox"]:focus-visible + .switch { outline: 2px solid var(--accent); outline-offset: 2px; }
    tr.row:focus-visible { outline-offset: -2px; }
    /* Disabled controls */
    select:disabled, input:disabled, button:disabled { opacity: 0.5; cursor: not-allowed; }
    select:disabled:hover { border-color: var(--border); }
    option:disabled { color: var(--disabled); }
    input.invalid { border-color: var(--danger); }
    .field-hint { font-size: 0.72rem; color: var(--muted); line-height: 1.35; min-height: 0; padding: 0.15rem 0; }
    .field-hint:empty { display: none; }
    .form-error { font-size: 0.8rem; color: var(--danger); margin-top: 0.7rem; line-height: 1.35; }
    .form-error:empty { display: none; }
    .hidden { display: none !important; }
    .range { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0.5rem; }

    button.go {
      margin-top: 1rem; padding: 0.55rem 1rem;
      background: linear-gradient(180deg, #2ea043, #1f7a34);
      color: white; border: 0; border-radius: 6px; cursor: pointer;
      font-weight: 600; letter-spacing: 0.02em; width: 100%;
    }
    button.go:hover { filter: brightness(1.1); }
    .status { margin-top: 0.5rem; font-size: 0.75rem; color: var(--muted); font-family: ui-monospace, monospace; text-align: right; }

    .schematic-panel { display: flex; flex-direction: column; }
    .schematic-panel .panel-header { gap: 0.6rem; flex-wrap: wrap; }
    .controls { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .iconbtn {
      width: 28px; height: 28px; border-radius: 6px;
      background: var(--panel-2); color: var(--text);
      border: 1px solid var(--border); cursor: pointer; padding: 0; font-size: 0.85rem;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .iconbtn:hover { background: var(--hover); }
    .speed-label {
      color: var(--muted); font-size: 0.75rem;
      display: inline-flex; align-items: center; height: 28px;
      margin: 0;
    }
    .rpm-readout {
      color: var(--muted); font-size: 0.8rem; font-family: ui-monospace, monospace;
      min-width: 0; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      display: inline-flex; align-items: center; justify-content: flex-end;
      height: 28px;
      margin: 0;
    }
    .coupling-note {
      font-size: 0.72rem; color: var(--muted);
      font-family: ui-monospace, monospace;
      padding: 0.15rem 0 0.1rem 0; min-height: 0.85rem;
      line-height: 1.3;
    }
    /* Preset picker — visually distinct from secondary role-select dropdowns. */
    .preset-select {
      width: 100%; max-width: 100%; min-width: 0; text-overflow: ellipsis; padding: 0.5rem 0.6rem;
      background: var(--panel-2); color: var(--text);
      border: 1px solid var(--accent); border-radius: 6px;
      font: inherit; font-size: 0.9rem; cursor: pointer;
    }
    .preset-select:focus { outline: 1px solid var(--accent); }
    /* Progressive-disclosure section (▸ Advanced …). */
    .advanced-section { margin: 0.6rem 0 0.3rem 0; }
    button.advanced-summary {
      display: block; width: 100%; text-align: left;
      cursor: pointer; user-select: none;
      color: var(--muted); font: inherit; font-size: 0.8rem;
      background: transparent; border: 0; border-radius: 0;
      padding: 0.35rem 0; border-top: 1px dashed var(--border);
    }
    .advanced-summary:hover { color: var(--text); }
    .advanced-arrow { display: inline-block; width: 1.1em; }
    .advanced-customized { color: var(--accent); font-style: italic; }
    .advanced-content { padding-left: 0.4rem; margin-bottom: 0.5rem; }
    .advanced-content.hidden { display: none; }
    .range-inputs input.invalid { border-color: var(--danger); }
    .legacy-derived { font-size: 0.7rem; opacity: 0.7; margin-top: 0.3rem; }
    /* Transient toast notifications — fixed stack, top-right. */
    .toast-stack {
      position: fixed; top: 1rem; right: 1rem; z-index: 100;
      display: flex; flex-direction: column; gap: 0.5rem;
      left: 1rem; max-width: 24rem; margin-left: auto; pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      display: flex; align-items: flex-start; gap: 0.6rem;
      background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-left-width: 3px;
      border-radius: 6px; padding: 0.6rem 0.7rem;
      font-size: 0.82rem; line-height: 1.35;
      box-shadow: 0 4px 16px var(--shadow);
      animation: toast-in 0.18s ease-out;
    }
    @keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
    .toast-error { border-left-color: var(--danger); }
    .toast-warn  { border-left-color: var(--warn); }
    .toast-info  { border-left-color: var(--accent); }
    .toast-msg { flex: 1; min-width: 0; word-break: break-word; }
    .toast-dismiss {
      flex: 0 0 auto; background: transparent; border: 0;
      color: var(--muted); cursor: pointer; font-size: 0.85rem;
      padding: 0; line-height: 1;
    }
    .toast-dismiss:hover { color: var(--text); }
    @keyframes cpgc-shimmer {
      0%   { transform: translateX(-60px); }
      100% { transform: translateX(320px); }
    }
    .cpgc-shimmer { animation: cpgc-shimmer 1.2s linear infinite; }
    input.speed { flex: 0 1 110px; width: 110px; min-width: 40px; padding: 0; height: 4px; cursor: pointer; }
    .schematic-sub { font-size: 0.78rem; color: var(--muted); font-family: ui-monospace, monospace; padding: 0.1rem 0 0.4rem 0; min-height: 1.1em; }
    .schematic {
      flex: 1;
      background:
        radial-gradient(circle at 30% 30%, var(--schematic-glow-1), transparent 60%),
        radial-gradient(circle at 70% 70%, var(--schematic-glow-2), transparent 60%),
        var(--schematic-bg);
      border: 1px solid var(--border); border-radius: 8px;
      min-height: 380px; padding: 0.5rem; min-width: 0; overflow: hidden;
    }
    .schematic svg { width: 100%; height: 100%; min-height: 360px; display: block; }
    .seg-group { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .seg { background: var(--panel-2); color: var(--muted); border: 0; padding: 0.2rem 0.65rem; font: inherit; font-size: 0.78rem; cursor: pointer; }
    .seg + .seg { border-left: 1px solid var(--border); }
    .seg:hover { background: var(--hover); }
    .seg.active { background: var(--accent); color: #fff; }
    .three-view { position: relative; width: 100%; height: 100%; min-height: 360px; user-select: none; } /* a double-click (reset) must not select the legend text */
    .three-host { position: absolute; inset: 0; }
    .three-host canvas { cursor: grab; max-width: 100%; }
    .three-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 1rem; color: var(--text); font-size: 0.9rem; pointer-events: none; }
    .three-msg:empty { display: none; }
    .three-legend { position: absolute; left: 0.5rem; bottom: 0.4rem; display: flex; flex-wrap: wrap; gap: 0.2rem 0.8rem; font: 0.7rem ui-monospace, monospace; color: var(--svg-sub); pointer-events: none; }
    .three-swatch { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 0.3rem; vertical-align: baseline; }

    .results-panel { padding: 0; overflow: hidden; }
    .results-panel .panel-header { padding: 0.85rem 1rem 0.4rem 1rem; margin: 0; }
    .table-wrap { max-height: 380px; max-width: 100%; overflow: auto; border-top: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { padding: 0.4rem 0.7rem; border-bottom: 1px solid rgba(48,54,61,0.6); text-align: left; }
    th { position: sticky; top: 0; background: var(--panel); color: var(--muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
    td.num, th:nth-child(-n+2), th:nth-child(8), th:nth-child(12) { text-align: right; font-family: ui-monospace, monospace; }
    tr.row { transition: background 0.08s linear; cursor: pointer; }
    tr.row:hover { background: var(--hover-soft); }
    tr.row.sel { background: var(--row-sel); }
    th.col-warn, td.col-warn { width: 1.5em; padding-left: 0.4rem; padding-right: 0.3rem; text-align: center; }
    .warn-glyph { color: var(--warn); font-size: 0.9rem; cursor: help; }

    .show-more-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.6rem 1rem; border-top: 1px solid var(--border);
      font-size: 0.85rem; gap: 0.6rem; flex-wrap: nowrap;
    }
    .show-more-row > .panel-sub {
      flex: 1 1 auto; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .show-more-right {
      display: inline-flex; align-items: center; gap: 0.4rem;
      margin-left: auto; flex: 0 0 auto;
    }
    .rows-label { font-size: 0.78rem; color: var(--muted); margin: 0; }
    .rows-select {
      height: 28px; padding: 0 1.7rem 0 0.6rem;
      background-color: var(--panel-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 5px;
      font: inherit; font-size: 0.78rem;
      cursor: pointer;
      appearance: none; -webkit-appearance: none; -moz-appearance: none;
      background-image:
        linear-gradient(45deg,  transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position:
        calc(100% - 12px) calc(50% - 1px),
        calc(100% - 7px)  calc(50% - 1px);
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }
    .rows-select:hover { border-color: var(--accent); }
    .rows-select:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
    .rows-select option { background: var(--panel); color: var(--text); }

    /* Topology composable controls */
    .topology { display: grid; gap: 0.35rem; }
    .topology-segment {
      display: inline-flex;
      width: 100%;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }
    .topology-segment > button {
      flex: 1; min-width: 0;
      padding: 0.4rem 0.6rem;
      font-size: 0.78rem; font-weight: 500;
      background: transparent; color: var(--muted);
      border: 0; border-radius: 4px;
      cursor: pointer; letter-spacing: 0;
      transition: background 0.1s linear, color 0.1s linear, box-shadow 0.1s linear;
    }
    .topology-segment > button:hover:not(:disabled):not(.active) {
      color: var(--text); background: var(--hover-soft);
    }
    .topology-segment > button.active {
      background: rgba(88, 166, 255, 0.18);
      color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(88,166,255,0.55);
    }
    .topology-segment > button:disabled { opacity: 0.4; cursor: not-allowed; }
    .topology-toggle {
      display: flex; align-items: center; gap: 0.55rem;
      font-size: 0.78rem; color: var(--muted);
      cursor: pointer; user-select: none;
      padding: 0.25rem 0;
      position: relative;
    }
    .topology-toggle.disabled { opacity: 0.4; cursor: not-allowed; }
    .topology-toggle .switch {
      position: relative; flex-shrink: 0;
      width: 28px; height: 16px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      transition: background 0.12s, border-color 0.12s;
    }
    .topology-toggle .switch::after {
      content: "";
      position: absolute; top: 1px; left: 1px;
      width: 12px; height: 12px;
      background: var(--muted);
      border-radius: 50%;
      transition: transform 0.12s, background 0.12s;
    }
    .topology-toggle input[type="checkbox"] {
      position: absolute; opacity: 0; pointer-events: none;
      width: 0; height: 0; margin: 0;
    }
    .topology-toggle input[type="checkbox"]:checked + .switch {
      background: rgba(88, 166, 255, 0.25);
      border-color: var(--accent);
    }
    .topology-toggle input[type="checkbox"]:checked + .switch::after {
      transform: translateX(12px);
      background: var(--accent);
    }
    .role-select {
      width: 100%; max-width: 100%; min-width: 0; text-overflow: ellipsis;
      height: 30px; padding: 0 1.8rem 0 0.55rem;
      background-color: var(--panel-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      font: inherit; font-size: 0.78rem;
      cursor: pointer;
      appearance: none; -webkit-appearance: none; -moz-appearance: none;
      background-image:
        linear-gradient(45deg,  transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position:
        calc(100% - 12px) calc(50% - 1px),
        calc(100% - 7px)  calc(50% - 1px);
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }
    .role-select:hover { border-color: var(--accent); }
    .role-select:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
    
    .topology-derived {
      font-size: 0.72rem; color: var(--muted);
      font-family: ui-monospace, monospace;
      padding: 0.2rem 0; opacity: 0.8;
    }
    .topology-hint {
      font-size: 0.72rem; color: var(--warn);
      padding: 0.1rem 0;
      min-height: 1em;  /* reserve a line so the form doesn't jump when the hint shows/hides */
    }
    /* Sort-by pills in the results-panel header */
    .results-panel .panel-header { flex-wrap: wrap; gap: 0.5rem; }
    .sort-pills { display: flex; gap: 0.3rem; flex-wrap: wrap; }
    .sort-pill {
      padding: 0.25rem 0.7rem; font-size: 0.75rem; font-weight: 600;
      background: var(--panel-2); color: var(--muted);
      border: 1px solid var(--border); border-radius: 999px; cursor: pointer;
      letter-spacing: 0.02em;
    }
    .sort-pill:hover { background: var(--hover); color: var(--text); }
    .sort-pill.active {
      background: rgba(88, 166, 255, 0.15);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Export buttons in the results-panel header */
    .exports { display: flex; gap: 0.4rem; }
    .export-btn {
      padding: 0.25rem 0.65rem; font-size: 0.78rem; font-weight: 600;
      background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
      border-radius: 5px; cursor: pointer; letter-spacing: 0.04em;
    }
    .export-btn:hover:not(:disabled) { background: var(--hover); border-color: var(--accent); color: var(--accent); }
    .export-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Dual-knob range slider */
    .range-row { display: grid; gap: 0.25rem; margin-top: 0.55rem; }
    .range-row > label:first-child { margin: 0; }
    .range-slider {
      position: relative;
      height: 22px;
      margin: 0.3rem 0.4rem 0.1rem;
    }
    .range-slider .range-track {
      position: absolute; top: 9px; left: 0; right: 0;
      height: 4px; background: var(--border); border-radius: 2px;
    }
    .range-slider .range-track-fill {
      position: absolute; top: 9px; height: 4px;
      background: var(--accent); border-radius: 2px;
      pointer-events: none;
    }
    .range-slider input[type="range"] {
      position: absolute; top: 0; left: 0; right: 0;
      width: 100%; height: 22px; margin: 0;
      pointer-events: none;
      background: transparent;
      -webkit-appearance: none; appearance: none;
    }
    .range-slider input[type="range"]::-webkit-slider-thumb {
      pointer-events: auto;
      -webkit-appearance: none; appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--accent); border: 2px solid var(--thumb-border);
      cursor: grab;
      margin-top: -5px;
    }
    .range-slider input[type="range"]::-webkit-slider-thumb:active { cursor: grabbing; }
    .range-slider input[type="range"]::-moz-range-thumb {
      pointer-events: auto;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--accent); border: 2px solid var(--thumb-border);
      cursor: grab;
    }
    .range-slider input[type="range"]::-webkit-slider-runnable-track {
      background: transparent; border: none;
    }
    .range-slider input[type="range"]::-moz-range-track { background: transparent; border: none; }
