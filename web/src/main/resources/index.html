<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Compound Planetary Gear Calculator</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel-2: #0e1116;
      --border: #30363d;
      --text: #e6e6e6;
      --muted: #a6accd;
      --accent: #58a6ff;
      --accent-2: #7ee787;
      --row-sel: #1f6feb44;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #0b0f14, #0d1117 320px);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 0.75rem 1.25rem;
      background: rgba(22, 27, 34, 0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: baseline; gap: 0.75rem;
      position: sticky; top: 0; z-index: 10;
    }
    header h1 { font-size: 1.05rem; margin: 0; letter-spacing: 0.01em; }
    header .badge {
      font-size: 0.7rem; color: var(--muted); padding: 2px 8px;
      border: 1px solid var(--border); border-radius: 999px;
    }
    .app { padding: 1rem; max-width: 1400px; margin: 0 auto; display: grid; gap: 1rem; }
    .top-grid { display: grid; grid-template-columns: 320px 1fr; gap: 1rem; }
    @media (max-width: 900px) { .top-grid { grid-template-columns: 1fr; } }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset;
    }
    .panel h2 { margin: 0 0 0.5rem 0; font-size: 0.95rem; color: var(--text); }
    .panel-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 0.5rem; }
    .panel-title { font-weight: 600; }
    .panel-sub { color: var(--muted); font-size: 0.8rem; font-family: ui-monospace, monospace; }

    label { display: block; font-size: 0.78rem; margin-top: 0.55rem; color: var(--muted); }
    input, select {
      width: 100%; padding: 0.4rem 0.5rem; background: var(--panel-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px; font: inherit;
    }
    input[type="number"] { font-variant-numeric: tabular-nums; }
    input:focus, select:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
    .range { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }

    button.go {
      margin-top: 1rem; padding: 0.55rem 1rem;
      background: linear-gradient(180deg, #2ea043, #1f7a34);
      color: white; border: 0; border-radius: 6px; cursor: pointer;
      font-weight: 600; letter-spacing: 0.02em; width: 100%;
    }
    button.go:hover { filter: brightness(1.1); }
    .status { margin-top: 0.5rem; font-size: 0.75rem; color: var(--muted); font-family: ui-monospace, monospace; text-align: right; }

    .schematic-panel { display: flex; flex-direction: column; }
    .schematic-panel .panel-header { gap: 0.6rem; flex-wrap: wrap; }
    .controls { display: flex; align-items: center; gap: 0.5rem; }
    .iconbtn {
      width: 28px; height: 28px; border-radius: 6px;
      background: var(--panel-2); color: var(--text);
      border: 1px solid var(--border); cursor: pointer; padding: 0; font-size: 0.85rem;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .iconbtn:hover { background: #21262d; }
    .speed-label {
      color: var(--muted); font-size: 0.75rem;
      display: inline-flex; align-items: center; height: 28px;
      margin: 0;
    }
    .rpm-readout {
      color: var(--muted); font-size: 0.8rem; font-family: ui-monospace, monospace;
      min-width: 6.5rem; text-align: right;
      display: inline-flex; align-items: center; justify-content: flex-end;
      height: 28px;
      margin: 0;
    }
    .coupling-note {
      font-size: 0.72rem; color: var(--muted);
      font-family: ui-monospace, monospace;
      padding: 0.15rem 0 0.1rem 0; min-height: 0.85rem;
      line-height: 1.3;
    }
    /* Preset picker — visually distinct from secondary role-select dropdowns. */
    .preset-select {
      width: 100%; padding: 0.5rem 0.6rem;
      background: var(--panel-2); color: var(--text);
      border: 1px solid var(--accent); border-radius: 6px;
      font: inherit; font-size: 0.9rem; cursor: pointer;
    }
    .preset-select:focus { outline: 1px solid var(--accent); }
    /* Progressive-disclosure section (▸ Advanced …). */
    .advanced-section { margin: 0.6rem 0 0.3rem 0; }
    .advanced-summary {
      cursor: pointer; user-select: none;
      color: var(--muted); font-size: 0.8rem;
      padding: 0.35rem 0; border-top: 1px dashed var(--border);
    }
    .advanced-summary:hover { color: var(--text); }
    .advanced-arrow { display: inline-block; width: 1.1em; }
    .advanced-customized { color: var(--accent); font-style: italic; }
    .advanced-content { padding-left: 0.4rem; margin-bottom: 0.5rem; }
    .advanced-content.hidden { display: none; }
    .legacy-derived { font-size: 0.7rem; opacity: 0.7; margin-top: 0.3rem; }
    /* Transient toast notifications — fixed stack, top-right. */
    .toast-stack {
      position: fixed; top: 1rem; right: 1rem; z-index: 100;
      display: flex; flex-direction: column; gap: 0.5rem;
      max-width: 24rem; pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      display: flex; align-items: flex-start; gap: 0.6rem;
      background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-left-width: 3px;
      border-radius: 6px; padding: 0.6rem 0.7rem;
      font-size: 0.82rem; line-height: 1.35;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      animation: toast-in 0.18s ease-out;
    }
    @keyframes toast-in { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
    .toast-error { border-left-color: #f85149; }
    .toast-warn  { border-left-color: #d29922; }
    .toast-info  { border-left-color: var(--accent); }
    .toast-msg { flex: 1; min-width: 0; word-break: break-word; }
    .toast-dismiss {
      flex: 0 0 auto; background: transparent; border: 0;
      color: var(--muted); cursor: pointer; font-size: 0.85rem;
      padding: 0; line-height: 1;
    }
    .toast-dismiss:hover { color: var(--text); }
    @keyframes cpgc-shimmer {
      0%   { transform: translateX(-60px); }
      100% { transform: translateX(320px); }
    }
    .cpgc-shimmer { animation: cpgc-shimmer 1.2s linear infinite; }
    input.speed { width: 110px; padding: 0; height: 4px; cursor: pointer; }
    .schematic-sub { font-size: 0.78rem; color: var(--muted); font-family: ui-monospace, monospace; padding: 0.1rem 0 0.4rem 0; min-height: 1.1em; }
    .schematic {
      flex: 1;
      background:
        radial-gradient(circle at 30% 30%, rgba(88,166,255,0.06), transparent 60%),
        radial-gradient(circle at 70% 70%, rgba(157,78,221,0.06), transparent 60%),
        #07090d;
      border: 1px solid var(--border); border-radius: 8px;
      min-height: 380px; padding: 0.5rem;
    }
    .schematic svg { width: 100%; height: 100%; min-height: 360px; display: block; }

    .results-panel { padding: 0; overflow: hidden; }
    .results-panel .panel-header { padding: 0.85rem 1rem 0.4rem 1rem; margin: 0; }
    .table-wrap { max-height: 380px; overflow: auto; border-top: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { padding: 0.4rem 0.7rem; border-bottom: 1px solid rgba(48,54,61,0.6); text-align: left; }
    th { position: sticky; top: 0; background: var(--panel); color: var(--muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
    td.num, th:nth-child(-n+2), th:nth-child(8), th:nth-child(12) { text-align: right; font-family: ui-monospace, monospace; }
    tr.row { transition: background 0.08s linear; cursor: pointer; }
    tr.row:hover { background: rgba(255,255,255,0.03); }
    tr.row.sel { background: var(--row-sel); }
    th.col-warn, td.col-warn { width: 1.5em; padding-left: 0.4rem; padding-right: 0.3rem; text-align: center; }
    .warn-glyph { color: #d29922; font-size: 0.9rem; cursor: help; }

    .show-more-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.6rem 1rem; border-top: 1px solid var(--border);
      font-size: 0.85rem; gap: 0.6rem; flex-wrap: nowrap;
    }
    .show-more-row > .panel-sub {
      flex: 1 1 auto; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .show-more-right {
      display: inline-flex; align-items: center; gap: 0.4rem;
      margin-left: auto; flex: 0 0 auto;
    }
    .rows-label { font-size: 0.78rem; color: var(--muted); margin: 0; }
    .rows-select {
      height: 28px; padding: 0 1.7rem 0 0.6rem;
      background-color: var(--panel-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 5px;
      font: inherit; font-size: 0.78rem;
      cursor: pointer;
      appearance: none; -webkit-appearance: none; -moz-appearance: none;
      background-image:
        linear-gradient(45deg,  transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position:
        calc(100% - 12px) calc(50% - 1px),
        calc(100% - 7px)  calc(50% - 1px);
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }
    .rows-select:hover { border-color: var(--accent); }
    .rows-select:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
    .rows-select option { background: var(--panel); color: var(--text); }

    /* Topology composable controls */
    .topology { display: grid; gap: 0.35rem; }
    .topology-segment {
      display: inline-flex;
      width: 100%;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }
    .topology-segment > button {
      flex: 1; min-width: 0;
      padding: 0.4rem 0.6rem;
      font-size: 0.78rem; font-weight: 500;
      background: transparent; color: var(--muted);
      border: 0; border-radius: 4px;
      cursor: pointer; letter-spacing: 0;
      transition: background 0.1s linear, color 0.1s linear, box-shadow 0.1s linear;
    }
    .topology-segment > button:hover:not(:disabled):not(.active) {
      color: var(--text); background: rgba(255,255,255,0.04);
    }
    .topology-segment > button.active {
      background: rgba(88, 166, 255, 0.18);
      color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(88,166,255,0.55);
    }
    .topology-segment > button:disabled { opacity: 0.4; cursor: not-allowed; }
    .topology-toggle {
      display: flex; align-items: center; gap: 0.55rem;
      font-size: 0.78rem; color: var(--muted);
      cursor: pointer; user-select: none;
      padding: 0.25rem 0;
      position: relative;
    }
    .topology-toggle.disabled { opacity: 0.4; cursor: not-allowed; }
    .topology-toggle .switch {
      position: relative; flex-shrink: 0;
      width: 28px; height: 16px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      transition: background 0.12s, border-color 0.12s;
    }
    .topology-toggle .switch::after {
      content: "";
      position: absolute; top: 1px; left: 1px;
      width: 12px; height: 12px;
      background: var(--muted);
      border-radius: 50%;
      transition: transform 0.12s, background 0.12s;
    }
    .topology-toggle input[type="checkbox"] {
      position: absolute; opacity: 0; pointer-events: none;
      width: 0; height: 0; margin: 0;
    }
    .topology-toggle input[type="checkbox"]:checked + .switch {
      background: rgba(88, 166, 255, 0.25);
      border-color: var(--accent);
    }
    .topology-toggle input[type="checkbox"]:checked + .switch::after {
      transform: translateX(12px);
      background: var(--accent);
    }
    .role-select {
      width: 100%;
      height: 30px; padding: 0 1.8rem 0 0.55rem;
      background-color: var(--panel-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      font: inherit; font-size: 0.78rem;
      cursor: pointer;
      appearance: none; -webkit-appearance: none; -moz-appearance: none;
      background-image:
        linear-gradient(45deg,  transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position:
        calc(100% - 12px) calc(50% - 1px),
        calc(100% - 7px)  calc(50% - 1px);
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }
    .role-select:hover { border-color: var(--accent); }
    .role-select:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
    .role-select option:disabled { color: #555; }
    .topology-derived {
      font-size: 0.72rem; color: var(--muted);
      font-family: ui-monospace, monospace;
      padding: 0.2rem 0; opacity: 0.8;
    }
    .topology-hint {
      font-size: 0.72rem; color: #d29922;
      padding: 0.1rem 0;
      min-height: 1em;  /* reserve a line so the form doesn't jump when the hint shows/hides */
    }
    /* Sort-by pills in the results-panel header */
    .results-panel .panel-header { flex-wrap: wrap; gap: 0.5rem; }
    .sort-pills { display: flex; gap: 0.3rem; flex-wrap: wrap; }
    .sort-pill {
      padding: 0.25rem 0.7rem; font-size: 0.75rem; font-weight: 600;
      background: var(--panel-2); color: var(--muted);
      border: 1px solid var(--border); border-radius: 999px; cursor: pointer;
      letter-spacing: 0.02em;
    }
    .sort-pill:hover { background: #21262d; color: var(--text); }
    .sort-pill.active {
      background: rgba(88, 166, 255, 0.15);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Export buttons in the results-panel header */
    .exports { display: flex; gap: 0.4rem; }
    .export-btn {
      padding: 0.25rem 0.65rem; font-size: 0.78rem; font-weight: 600;
      background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
      border-radius: 5px; cursor: pointer; letter-spacing: 0.04em;
    }
    .export-btn:hover:not(:disabled) { background: #21262d; border-color: var(--accent); color: var(--accent); }
    .export-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Dual-knob range slider */
    .range-row { display: grid; gap: 0.25rem; margin-top: 0.55rem; }
    .range-row > label:first-child { margin: 0; }
    .range-slider {
      position: relative;
      height: 22px;
      margin: 0.3rem 0.4rem 0.1rem;
    }
    .range-slider .range-track {
      position: absolute; top: 9px; left: 0; right: 0;
      height: 4px; background: var(--border); border-radius: 2px;
    }
    .range-slider .range-track-fill {
      position: absolute; top: 9px; height: 4px;
      background: var(--accent); border-radius: 2px;
      pointer-events: none;
    }
    .range-slider input[type="range"] {
      position: absolute; top: 0; left: 0; right: 0;
      width: 100%; height: 22px; margin: 0;
      pointer-events: none;
      background: transparent;
      -webkit-appearance: none; appearance: none;
    }
    .range-slider input[type="range"]::-webkit-slider-thumb {
      pointer-events: auto;
      -webkit-appearance: none; appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--accent); border: 2px solid #0d1117;
      cursor: grab;
      margin-top: -5px;
    }
    .range-slider input[type="range"]::-webkit-slider-thumb:active { cursor: grabbing; }
    .range-slider input[type="range"]::-moz-range-thumb {
      pointer-events: auto;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--accent); border: 2px solid #0d1117;
      cursor: grab;
    }
    .range-slider input[type="range"]::-webkit-slider-runnable-track {
      background: transparent; border: none;
    }
    .range-slider input[type="range"]::-moz-range-track { background: transparent; border: none; }
    .range-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; }
    .range-inputs input.range-num { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header>
    <h1>Compound Planetary Gear Calculator</h1>
    <span class="badge">Scala 3 · Scala.js · Laminar</span>
  </header>
  <div id="app"></div>
  <script src="./cpgc-web-fastopt/main.js"></script>
</body>
</html>
